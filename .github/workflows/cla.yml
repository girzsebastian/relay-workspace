name: CLA

# Records that contributors have signed CLA.md before their work is merged.
#
# This is not bureaucracy for its own sake. Relay is AGPL-3.0 and the desktop
# application stays free and open under it, but a hosted Relay may one day need
# to be offered under other terms to fund the work. Doing that needs permission
# from every copyright holder, and a project that collects contributions without
# an agreement can never get it — twenty signatures years after the fact, with
# one unreachable person enough to block it. Signatures collected now cost one
# reply; collected later they cost the option entirely.
#
# Self-hosted deliberately: signatures live in this repository rather than with a
# third-party service that could disappear and take the record with it.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/girzsebastian/relay-workspace/blob/main/CLA.md
          branch: main
          # Dependabot bumps version strings and github-actions writes the
          # signature file itself; neither carries authorship to license.
          allowlist: girzsebastian,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            [CLA.md](https://github.com/girzsebastian/relay-workspace/blob/main/CLA.md)
            and sign by posting the comment below. You keep the copyright to
            everything you write — this grants a licence so a hosted Relay can be
            offered under other terms later without tracking down every
            contributor. Nothing you contribute leaves the AGPL version. You sign
            once, and it covers all your future pull requests.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thanks."
